name: peso_tracker
description: "PesoTracker - Filipino Financial Tracker App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^16.2.0
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # File handling for backup/restore (web compatible)
  file_picker: ^10.3.1
  
  # Web-compatible packages
  universal_html: ^2.2.4
  
  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.4
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  
  # UI Enhancements
  flutter_svg: ^2.0.9
  lottie: ^3.3.1
  confetti: ^0.8.0
  
  # Development
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/
  
